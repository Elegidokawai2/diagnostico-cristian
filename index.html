<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand - Inicio</title>

  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header>
    <nav class="navbar custom-navbar sticky-top py-3">
      <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand text-dark fw-bold fs-3 mb-0" href="index.html">
          Brand
        </a>

        <ul class="navbar-nav d-none d-md-flex flex-row align-items-center gap-4 mb-0 mx-auto">
          <li class="nav-item">
            <a class="nav-link active px-2 py-1" href="index.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-2 py-1" href="views/productos.html">Productos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-2 py-1" href="#nosotros">Nosotros</a>
          </li>
        </ul>

        <div class="d-flex align-items-center">
          <a href="views/productos.html" class="cart-icon-btn position-relative text-dark p-2"
            aria-label="Carrito de compras">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span
              class="position-absolute top-1 start-100 translate-middle p-1 bg-danger border border-light rounded-circle cart-red-dot">
              <span class="visually-hidden">Productos en carrito</span>
            </span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main role="main">
    <section class="hero-section-light py-4 py-md-5">
      <div class="container">
        <div class="row align-items-center g-3 g-md-4">
          <div class="col-7 col-md-6 text-start">
            <h1 class="hero-title-dark mb-2 mb-md-3 fw-bold">
              Encuentra lo<br> que necesitas
            </h1>
            <p class="hero-subtitle-gray mb-3 mb-md-4">
              Productos de calidad al<br class="d-none d-md-inline"> mejor precio.
            </p>
            <div>
              <a href="views/productos.html" class="btn-royal-blue">
                Ver productos
              </a>
            </div>
          </div>

          <div class="col-5 col-md-6 text-center">
            <div class="hero-img-container mx-auto">
              <img
                src="https://www.steren.com.mx/media/catalog/product/cache/0236bbabe616ddcff749ccbc14f38bf2/image/23017b42b/audifonos-bluetooth-multipunto-anc.jpg"
                alt="Audífonos" class="img-fluid hero-clean-img">
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="benefits-section-clean py-3 py-md-4 my-2">
      <div class="container">
        <div class="row g-3 g-md-4 benefits-row justify-content-between">
          <div class="col-12 col-md-4">
            <div class="benefit-clean-item d-flex align-items-center gap-3">
              <div class="benefit-blue-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2">
                  <rect x="1" y="3" width="15" height="13"></rect>
                  <polygon points="16 8 20 8 23 11 23 16 16 16 8"></polygon>
                  <circle cx="5.5" cy="18.5" r="2.5"></circle>
                  <circle cx="18.5" cy="18.5" r="2.5"></circle>
                </svg>
              </div>
              <div>
                <h6 class="benefit-clean-title fw-bold mb-0">Envío gratis</h6>
                <span class="benefit-clean-subtitle text-muted small">En pedidos +$50</span>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-4">
            <div class="benefit-clean-item d-flex align-items-center gap-3">
              <div class="benefit-blue-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
              </div>
              <div>
                <h6 class="benefit-clean-title fw-bold mb-0">Garantía</h6>
                <span class="benefit-clean-subtitle text-muted small">30 días</span>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-4">
            <div class="benefit-clean-item d-flex align-items-center gap-3">
              <div class="benefit-blue-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2">
                  <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                  <path
                    d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z">
                  </path>
                </svg>
              </div>
              <div>
                <h6 class="benefit-clean-title fw-bold mb-0">Soporte</h6>
                <span class="benefit-clean-subtitle text-muted small">24/7</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="categories-section-clean py-3 py-md-4 my-2">
      <div class="container">
        <h4 class="fw-bold section-heading-dark mb-3 mb-md-4 text-start">Categorías populares</h4>

        <div class="row g-2 g-md-4">
          <div class="col-4">
            <a href="views/productos.html?cat=Tecnología" class="category-clean-card text-decoration-none">
              <div class="category-img-container">
                <img src="https://image.made-in-china.com/251f0j00AGEUewjsLaWd/made-in-china.jpg" alt="Tecnología"
                  class="img-fluid category-clean-img" loading="lazy">
              </div>
              <div class="category-label text-center py-1 py-md-2">
                <span class="fw-semibold text-dark">Tecnología</span>
              </div>
            </a>
          </div>

          <div class="col-4">
            <a href="views/productos.html?cat=Hogar" class="category-clean-card text-decoration-none">
              <div class="category-img-container">
                <img
                  src="https://cloudfront.dico.com.mx/media/catalog/product/cache/f19118d77c4719d7f47d358600c979dd/s/a/sala-moderna-sofa-gris-uma_sal54622s1-ai-f-01-jpg.jpg?___store=df"
                  alt="Hogar" class="img-fluid category-clean-img" loading="lazy">
              </div>
              <div class="category-label text-center py-1 py-md-2">
                <span class="fw-semibold text-dark">Hogar</span>
              </div>
            </a>
          </div>

          <div class="col-4">
            <a href="views/productos.html?cat=Accesorios" class="category-clean-card text-decoration-none">
              <div class="category-img-container">
                <img src="https://ss327.liverpool.com.mx/xl/1182254475.jpg" alt="Accesorios"
                  class="img-fluid category-clean-img" loading="lazy">
              </div>
              <div class="category-label text-center py-1 py-md-2">
                <span class="fw-semibold text-dark">Accesorios</span>
              </div>
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/main.js"></script>

</html>
