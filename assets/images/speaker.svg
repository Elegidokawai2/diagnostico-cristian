<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 400 300 width=100% height=100%>
  <defs>
    <linearGradient id=bgGrad6 x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#1e1b4b />
      <stop offset=100% stop-color=#31104b />
    </linearGradient>
    <linearGradient id=speakerGrad x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#f43f5e />
      <stop offset=100% stop-color=#8b5cf6 />
    </linearGradient>
  </defs>
  <rect width=400 height=300 rx=16 fill=url(#bgGrad6)/>
  <!-- Speaker Cylinder Body -->
  <g transform=translate(130, 40)>
    <rect x=0 y=20 width=140 height=180 rx=30 fill=#0f172a stroke=#334155 stroke-width=4/>
    <!-- Mesh Grille -->
    <rect x=15 y=45 width=110 height=130 rx=16 fill=#1e293b/>
    <!-- Bass Driver -->
    <circle cx=70 cy=85 r=28 fill=#090d16 stroke=url(#speakerGrad) stroke-width=4/>
    <circle cx=70 cy=85 r=14 fill=#334155/>
    <!-- Subwoofer -->
    <circle cx=70 cy=145 r=20 fill=#090d16 stroke=url(#speakerGrad) stroke-width=3/>
    <!-- Controls Top -->
    <rect x=30 y=10 width=80 height=10 rx=5 fill=#475569/>
    <circle cx=50 cy=15 r=2.5 fill=#ffffff/>
    <circle cx=70 cy=15 r=2.5 fill=#38bdf8/>
    <circle cx=90 cy=15 r=2.5 fill=#ffffff/>
  </g>
</svg>
