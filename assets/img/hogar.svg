<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 400 320 width=100% height=100%>
  <defs>
    <linearGradient id=bgLight6 x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#f8fafc />
      <stop offset=100% stop-color=#e2e8f0 />
    </linearGradient>
    <linearGradient id=sofaBeige x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#d6c5b3 />
      <stop offset=100% stop-color=#b8a593 />
    </linearGradient>
    <filter id=softShadow6 x=-10% y=-10% width=120% height=130%>
      <feDropShadow dx=0 dy=12 stdDeviation=14 flood-color=#0f172a flood-opacity=0.18/>
    </filter>
  </defs>
  <rect width=400 height=320 rx=16 fill=url(#bgLight6)/>
  <ellipse cx=200 cy=270 rx=90 ry=12 fill=#cbd5e1 opacity=0.6/>
  <g filter=url(#softShadow6) transform=translate(80, 95)>
    <!-- Respaldo Sofa -->
    <rect x=25 y=10 width=190 height=75 rx=18 fill=url(#sofaBeige) stroke=#a89583 stroke-width=2/>
    <!-- Cojines Respaldo -->
    <rect x=35 y=18 width=80 height=60 rx=10 fill=#e2d4c5/>
    <rect x=125 y=18 width=80 height=60 rx=10 fill=#e2d4c5/>
    <!-- Asiento / Base -->
    <rect x=15 y=65 width=210 height=48 rx=12 fill=url(#sofaBeige) stroke=#a89583 stroke-width=2/>
    <!-- Brazos laterales -->
    <rect x=5 y=45 width=30 height=65 rx=12 fill=#c4b2a0/>
    <rect x=205 y=45 width=30 height=65 rx=12 fill=#c4b2a0/>
    <!-- Patas de madera -->
    <line x1=25 y1=113 x2=18 y2=132 stroke=#78350f stroke-width=6 stroke-linecap=round/>
    <line x1=215 y1=113 x2=222 y2=132 stroke=#78350f stroke-width=6 stroke-linecap=round/>
  </g>
</svg>
