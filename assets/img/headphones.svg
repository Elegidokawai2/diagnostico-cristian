<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 400 320 width=100% height=100%>
  <defs>
    <linearGradient id=bgLight1 x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#f1f5f9 />
      <stop offset=100% stop-color=#e2e8f0 />
    </linearGradient>
    <linearGradient id=blackMatte x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#27272a />
      <stop offset=50% stop-color=#18181b />
      <stop offset=100% stop-color=#09090b />
    </linearGradient>
    <filter id=softShadow x=-10% y=-10% width=120% height=130%>
      <feDropShadow dx=0 dy=12 stdDeviation=16 flood-color=#0f172a flood-opacity=0.22/>
    </filter>
  </defs>
  <rect width=400 height=320 rx=16 fill=url(#bgLight1)/>
  <ellipse cx=200 cy=275 rx=80 ry=14 fill=#cbd5e1 opacity=0.6/>
  <g filter=url(#softShadow)>
    <!-- Diadema / Headband -->
    <path d=M 125 180 A 75 75 0 0 1 275 180 fill=none stroke=#27272a stroke-width=22 stroke-linecap=round/>
    <path d=M 135 155 A 65 65 0 0 1 265 155 fill=none stroke=#3f3f46 stroke-width=12 stroke-linecap=round/>
    <!-- Left Cup -->
    <g transform=translate(100, 150)>
      <ellipse cx=20 cy=45 rx=22 ry=40 fill=url(#blackMatte) stroke=#52525b stroke-width=2/>
      <ellipse cx=22 cy=45 rx=14 ry=28 fill=#18181b/>
      <circle cx=22 cy=45 r=8 fill=#27272a/>
    </g>
    <!-- Right Cup -->
    <g transform=translate(260, 150)>
      <ellipse cx=20 cy=45 rx=22 ry=40 fill=url(#blackMatte) stroke=#52525b stroke-width=2/>
      <ellipse cx=18 cy=45 rx=14 ry=28 fill=#18181b/>
      <circle cx=18 cy=45 r=8 fill=#27272a/>
    </g>
  </g>
</svg>
