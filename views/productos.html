<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand - Nuestros Productos</title>

  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/productos.css">
</head>

<body>

  <header>
    <nav class="navbar custom-navbar sticky-top py-3">
      <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand text-dark fw-bold fs-3 mb-0" href="../index.html">
          Brand
        </a>

        <ul class="navbar-nav d-none d-md-flex flex-row align-items-center gap-4 mb-0 mx-auto">
          <li class="nav-item">
            <a class="nav-link px-2 py-1" href="../index.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active px-2 py-1" href="productos.html">Productos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-2 py-1" href="../index.html#nosotros">Nosotros</a>
          </li>
        </ul>

        <div class="d-flex align-items-center">
          <a href="productos.html" class="cart-icon-btn position-relative text-dark p-2"
            aria-label="Carrito de compras">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span
              class="position-absolute top-1 start-100 translate-middle p-1 bg-danger border border-light rounded-circle cart-red-dot">
              <span class="visually-hidden">Productos en carrito</span>
            </span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="products-view container my-4 my-md-5" role="main">
    <div class="mb-4">
      <h2 class="fw-bold text-dark section-heading-dark mb-0">Nuestros productos</h2>
    </div>

    <div class="search-filter-bar mb-4">
      <form id="search-form" class="row g-2 align-items-center">
        <div class="col-8 col-sm-9 col-md-10">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted ps-3">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2.5">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <input type="text" id="search-input" class="form-control form-control-clean border-start-0 ps-2"
              placeholder="Buscar productos...">
            <button class="btn btn-clean-clear d-none" type="button" id="clear-btn">✕</button>
          </div>
        </div>
        <div class="col-4 col-sm-3 col-md-2">
          <button type="submit" id="filter-btn" class="btn btn-filter-gray w-100">
            Filtrar
          </button>
        </div>
      </form>
    </div>

    <div id="products-container" class="products-mockup-grid mb-5"></div>

    <div class="pagination-container d-flex justify-content-center align-items-center gap-2 my-5">
      <button type="button" class="pagination-btn-square active" data-page="1">1</button>
      <button type="button" class="pagination-btn-square" data-page="2">2</button>
      <button type="button" class="pagination-btn-square" data-page="3">3</button>
    </div>
  </main>

  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/products-data.js"></script>
  <script src="../js/productos.js"></script>

</body>

</html>
